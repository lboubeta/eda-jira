---
- name: Poll Jira for open bugs
  hosts: all
  sources:
    - redhat_iberia.eda.jira_jql:
        jira_url: "https://lboubeta.atlassian.net"
        jira_user: "lboubeta@redhat.com"
        jira_token: '{{ jira_api_token }}'
        jql: 'project = AAP'
        delay: 60

  rules:
    - name: Debug every issue returned by JQL search
      condition: true
      action:
        debug:
          msg: "Jira issue from search: {{ event }}"
