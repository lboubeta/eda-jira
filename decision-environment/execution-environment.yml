---
version: 3

images:
  base_image:
    name: registry.redhat.io/ansible-automation-platform-25/de-minimal-rhel9:latest

dependencies:
  python: requirements.txt
  galaxy: requirements.yml
  python_interpreter:
    package_system: python3.12
  exclude:
    all_from_collections:
      # ansible.eda is already installed in de-minimal.
      - ansible.eda

options:
  package_manager_path: /usr/bin/microdnf

additional_build_steps:
  append_builder:
    - COPY . /tmp/jira.event_driven_ansible
    - RUN ansible-galaxy collection install /tmp/jira.event_driven_ansible
